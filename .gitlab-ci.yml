stages:
  - build
  - dockerize
  - deploy

cache:
  key: "$CI_JOB_NAME"
  paths:
    - node_modules/
    - dist/

build_job:
  stage: build
  image: node:18
  script:
    - npm install
    - npm run build:ssr --configuration=production
    - cp sitemap.xml dist/anysense_front/browser
    - cp robots.txt dist/anysense_front/browser
  only:
    - main
    - temporary

dockerize_job:
  stage: dockerize
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - apk add --no-cache docker-cli-compose
    - docker build -t anysense-front:latest .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker tag anysense-front:latest $CI_REGISTRY_IMAGE/anysense-front:latest
    - docker tag anysense-front:latest $CI_REGISTRY_IMAGE/anysense-front:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/anysense-front:latest
    - docker push $CI_REGISTRY_IMAGE/anysense-front:$CI_COMMIT_SHORT_SHA
  only:
    - main
    - temporary

deploy_job:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - 'command -v ssh-agent >/dev/null || ( apk add --no-cache openssh )'
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan $SSH_IP_SERVER >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SSH_USER@$SSH_IP_SERVER "
        sudo docker login -u gitlab-ci-token -p $CI_JOB_TOKEN registry.gitlab.com &&
        sudo docker pull ${CI_REGISTRY_IMAGE}/anysense-front:latest &&
        if sudo docker ps -a | grep anysense-front; then
            sudo docker stop anysense-front &&
            sudo docker rm anysense-front;
        fi &&
        cd ~/docker/anysense-front &&
        sudo CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE ANYSENSE_VPS_NET=$ANYSENSE_VPS_NET docker-compose up -d
      "
  environment:
    name: production
  only:
    - main
    - temporary

