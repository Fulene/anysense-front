<div class="profile-selection-container">
  <img class="logo" (click)="navigateTo('/')" ngSrc="assets/images/shared/logo1.jpg" alt="logo" priority="true" height="40" width="167">

  <section>
    <h1>Quelle est votre situation ?</h1>

    <button class="profile" (click)="onSelectProfileType('customer')">
      <img ngSrc="https://fakeimg.pl/48/" alt="logo" priority="true" height="48" width="48">
      <div>
        <h2>Client</h2>
        <p>Je recherche des prestataires</p>
      </div>
      <mat-icon aria-hidden="false" aria-label="Example home icon">keyboard_arrow_right</mat-icon>
    </button>

    <button class="profile" (click)="onSelectProfileType('contractor')">
      <img ngSrc="https://fakeimg.pl/48/" alt="logo" priority="true" height="48" width="48">
      <div>
        <h2>Prestataires</h2>
        <p>Je créer mon profil</p>
      </div>
      <mat-icon aria-hidden="false" aria-label="Example home icon">keyboard_arrow_right</mat-icon>
    </button>
    <p class="login" (click)="login()">J'ai déjà un compte</p>
  </section>

</div>
