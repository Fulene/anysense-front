<h1>test auth</h1>
<div>
  <h3>{{ userName }}</h3>
  <button (click)="logout()">Logout</button>
</div>
<section *ngIf="contractors.length">
  <button (click)="onTest()">test</button>
  <pre>{{ contractors.length }}</pre>
  <div *ngFor="let subcontractor of contractors">
    <p>{{ subcontractor.kcID }}</p>
    <p>{{ subcontractor.name }}</p>
    <p>{{ subcontractor.firstname }}</p>
    <hr>
  </div>
</section>
