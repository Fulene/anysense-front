<h1>test auth</h1>
<div>
  <h3>{{ userName }}</h3>
  <button (click)="logout()">Logout</button>
</div>
<section *ngIf="users.length">
  <button (click)="onTest()">test</button>
  <pre>{{ users.length }}</pre>
  <div *ngFor="let user of users">
    <p>{{ user.kcId }}</p>
    <p>{{ user.name }}</p>
    <p>{{ user.firstname }}</p>
    <p>{{ user.email }}</p>
    <p>{{ user.profiles }}</p>
    <hr>
  </div>
</section>
