<h1>test auth !!!</h1>
{{ userService.userLogged | json }}
<div>
  <h3>{{ userName }}</h3>
  <button (click)="brevo()">Brevo</button>
  <button (click)="logout()">Logout</button>
</div>
<section *ngIf="users.length">
  <button (click)="onTest()">test</button>
  <pre>{{ users.length }}</pre>
  <div *ngFor="let user of users">
    <p>{{ user.kcId }}</p>
    <p>{{ user.lastname }}</p>
    <p>{{ user.firstname }}</p>
    <p>{{ user.email }}</p>
    <p>{{ user.profiles }}</p>
    <hr>
  </div>
</section>
