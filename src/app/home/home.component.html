<h1>App en construction</h1>
<section *ngIf="subcontractors.length">
  <button (click)="onTest()">test</button>
  <pre>{{ subcontractors.length }}</pre>
  <div *ngFor="let subcontractor of subcontractors">
    <p>{{ subcontractor.kcID }}</p>
    <p>{{ subcontractor.name }}</p>
    <p>{{ subcontractor.firstname }}</p>
    <br>
    <hr>
    <br>
  </div>

</section>
