<nav>
  <div class="left">
    <img (click)="navigateTo('/')" ngSrc="../../../../assets/images/core/logo1.jpg" alt="logo" priority="true" height="40" width="167">
    <ul>
      <li (click)="navigateTo('/test')">Entreprises</li>
      <li (click)="navigateTo('/')">Prestataires</li>
      <li (click)="navigateTo('/')">Solutions</li>
      <li (click)="navigateTo('/')">Ressources</li>
    </ul>
  </div>

  <div class="right" *ngIf="!isLoading">
    <ng-container *ngIf="!isUserLoggedInKc">
      <app-button theme="primary" label="Créer mon compte" (onClick)="navigateTo('/signup')"></app-button>
      <app-button-bis label="Me connecter" (onClick)="login()"></app-button-bis>
    </ng-container>

    <ng-container *ngIf="isUserLoggedInKc && !userLoggedInApp">
      <app-button-bis label="Compléter mon profile" (onClick)="navigateTo('/signup')"></app-button-bis>
      <app-button-bis label="Se déconnecter" (onClick)="logout()"></app-button-bis>
    </ng-container>

    <ng-container *ngIf="userLoggedInApp">
      <app-button-bis label="Tableau de bord" (onClick)="navigateTo('/dashboard')"></app-button-bis>
      <!--   todo : to remove   -->
      <app-button-bis label="Se déconnecter" (onClick)="logout()"></app-button-bis>
    </ng-container>
  </div>
</nav>
